name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Release-Bundle erstellen
        shell: bash
        run: |
          set -euo pipefail
          NAME="PiHole-Unbound-Docker-${GITHUB_REF_NAME}"
          mkdir -p "dist/${NAME}"
          rsync -a \
            --exclude '.git' \
            --exclude '.env' \
            --exclude 'etc-pihole' \
            --exclude 'secrets/pihole_webpassword.txt' \
            --exclude 'backups/*.tar.gz' \
            ./ "dist/${NAME}/"
          tar -C dist -czf "dist/${NAME}.tar.gz" "${NAME}"
          (cd dist && sha256sum "${NAME}.tar.gz" > "${NAME}.sha256")

      - name: GitHub Release erstellen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --generate-notes \
            --title "PiHole-Unbound-Docker $GITHUB_REF_NAME" \
            dist/*.tar.gz dist/*.sha256
