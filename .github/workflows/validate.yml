name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      # GitHub behält das Execute-Bit nicht zuverlässig bei, wenn Dateien
      # z. B. über die Weboberfläche hochgeladen/ersetzt wurden.
      - name: Shell-Skripte ausführbar machen
        run: chmod +x scripts/*.sh unbound/entrypoint.sh

      - name: ShellCheck installieren
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Shell-Skripte prüfen
        run: shellcheck scripts/*.sh unbound/entrypoint.sh

      - name: Statische Repository-Prüfung
        run: python3 scripts/validate.py

      - name: Temporäre CI-Konfiguration erzeugen
        run: |
          mkdir -p secrets etc-pihole
          printf 'ci-only-not-a-real-secret\n' > secrets/pihole_webpassword.txt
          cp .env.example .env
          # Auf GitHub Runnern können Standardports bereits belegt sein.
          sed -i 's/^PIHOLE_DNS_PORT=.*/PIHOLE_DNS_PORT=5353/' .env
          sed -i 's/^PIHOLE_HTTP_PORT=.*/PIHOLE_HTTP_PORT=18080/' .env
          sed -i 's/^PIHOLE_HTTPS_PORT=.*/PIHOLE_HTTPS_PORT=18443/' .env

      - name: Docker-Compose-Konfiguration validieren
        run: docker compose config --quiet

      - name: NAS-/Portainer-Standalone-Compose validieren
        run: |
          PIHOLE_DNS_PORT=15353 \
          PIHOLE_HTTP_PORT=18081 \
          PIHOLE_HTTPS_PORT=18444 \
          docker compose -f compose.nas.yaml config --quiet

      - name: NAS-/Portainer-Standalone-Images prüfen
        run: docker compose -f compose.nas.yaml pull --quiet

      - name: Images bauen
        run: docker compose build --pull

      - name: Stack starten und Healthchecks abwarten
        run: docker compose up -d --wait --wait-timeout 180

      - name: Containerstatus prüfen
        run: |
          docker compose ps
          test "$(docker inspect --format '{{.State.Health.Status}}' blackrabbitz-unbound)" = "healthy"
          test "$(docker inspect --format '{{.State.Health.Status}}' blackrabbitz-pihole)" = "healthy"

      - name: DNS-, Rekursions- und DNSSEC-Integrationstest
        # Explizit über /bin/sh starten: funktioniert auch dann, wenn ein
        # späterer Commit versehentlich das Execute-Bit wieder verliert.
        run: sh ./scripts/test-dns.sh

      - name: Logs bei Fehlern ausgeben
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Stack aufräumen
        if: always()
        run: docker compose down -v --remove-orphans
