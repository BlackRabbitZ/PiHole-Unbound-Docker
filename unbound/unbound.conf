#
# Rekursiver Resolver für Pi-hole. Angelehnt an die offizielle Pi-hole-Unbound-
# Empfehlung und NLnet-Labs-Unbound-Konfigurationsprinzipien.

server:
    verbosity: __UNBOUND_VERBOSITY__
    interface: 0.0.0.0
    port: 5335

    username: "unbound"
    directory: "/etc/unbound"
    chroot: ""
    pidfile: "/run/unbound/unbound.pid"

    do-ip4: yes
    do-ip6: yes
    do-udp: yes
    do-tcp: yes
    prefer-ip6: no

    num-threads: __UNBOUND_THREADS__

    # DNSSEC
    auto-trust-anchor-file: "/var/lib/unbound/root.key"
    harden-glue: yes
    harden-dnssec-stripped: yes
    harden-below-nxdomain: yes
    val-clean-additional: yes

    # Privatsphäre / Datenminimierung
    qname-minimisation: yes
    qname-minimisation-strict: no
    minimal-responses: yes
    hide-identity: yes
    hide-version: yes
    identity: "DNS"
    version: "DNS"

    # Cache / Performance
    prefetch: yes
    prefetch-key: yes
    cache-min-ttl: 0
    cache-max-ttl: 86400
    msg-cache-size: 32m
    rrset-cache-size: 64m
    key-cache-size: 16m
    neg-cache-size: 4m

    # Fragmentierung vermeiden; entspricht der aktuellen Pi-hole-Empfehlung.
    edns-buffer-size: 1232

    # Nur das Docker-DNS-Backend darf den Resolver benutzen.
    # Docker-Bridge-Netze stammen standardmäßig aus privaten RFC1918-Bereichen.
    access-control: 0.0.0.0/0 refuse
    access-control: 10.0.0.0/8 allow
    access-control: 172.16.0.0/12 allow
    access-control: 192.168.0.0/16 allow

    # DNS-Rebinding-/Private-Address-Härtung
    private-address: 10.0.0.0/8
    private-address: 172.16.0.0/12
    private-address: 192.168.0.0/16
    private-address: 169.254.0.0/16
    private-address: 100.64.0.0/10
    private-address: fd00::/8
    private-address: fe80::/10
    private-address: 192.0.2.0/24
    private-address: 198.51.100.0/24
    private-address: 203.0.113.0/24
    private-address: 255.255.255.255/32
    private-address: 2001:db8::/32

    # Missbrauchsschutz
    unwanted-reply-threshold: 10000000
    ratelimit: 1000
    ip-ratelimit: 500

    # Keine Dateien loggen; Docker sammelt stdout/stderr.
    use-syslog: no
    logfile: ""
    log-time-ascii: yes
    log-queries: no
    log-replies: no
    log-servfail: yes

remote-control:
    control-enable: no
